name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.2 build-tools;36.0.0 platform-tools

      - name: Use the runner JDK
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Check the tag matches the app version
        run: |
          version=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '\r')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION_NAME ${version}"
            exit 1
          fi

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Write the signing config
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Test and assemble the signed release
        run: chmod +x gradlew && ./gradlew test assembleRelease --stacktrace

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '\r')
          apk="stool-sentry-${version}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --title "Stool Sentry ${tag}" --notes ""
          fi
