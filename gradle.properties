# JDK 21 is required. This machine's JAVA_HOME is JDK 8, so the path to JDK 21
# lives in the user Gradle file (%USERPROFILE%\.gradle\gradle.properties), not here.
# A path in this file breaks the F-Droid buildserver.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
kotlin.code.style=official
